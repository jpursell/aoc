[package]
name = "aoc"
version = "0.1.0"
edition = "2021"
default-run = "aoc"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.4", features = ["derive"] }
counter = "0.7.0"
dirs = "6.0.0"
dotenv = "0.15.0"
good_lp = "1.14.2"
itertools = "0.14.0"
nalgebra = "0.34.1"
ndarray = "0.17.1"
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "0.12.24", features = ["blocking"] }

[[bin]]
name = "scaffold"
path = "src/bin/scaffold.rs"

[[bin]]
name = "y2025d05"
path = "src/bin/y2025d05.rs"
